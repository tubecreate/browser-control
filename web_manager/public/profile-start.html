<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading profile...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2d3a;
      --accent: #667eea;
      --accent2: #764ba2;
      --text: #e8eaf6;
      --muted: #6b7280;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(102,126,234,0.15), transparent),
                  radial-gradient(ellipse 60% 40% at 80% 100%, rgba(118,75,162,0.1), transparent);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 24px;
      animation: fadeUp 0.5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Profile Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    /* Avatar */
    .avatar-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(102,126,234,0.3);
    }

    .profile-info h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
      margin-bottom: 4px;
    }

    .profile-info .subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    /* Status pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .status-pill.active {
      background: rgba(16,185,129,0.15);
      color: var(--green);
      border: 1px solid rgba(16,185,129,0.3);
    }
    .status-pill .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Info rows */
    .info-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .info-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-label .icon { font-size: 14px; }

    .info-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-align: right;
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-value.proxy-ok { color: var(--green); }
    .info-value.proxy-none { color: var(--muted); font-weight: 400; font-style: italic; }

    /* Tags */
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      padding: 3px 10px;
      background: rgba(102,126,234,0.12);
      border: 1px solid rgba(102,126,234,0.25);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .brand span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .open-time {
      font-size: 11px;
      color: var(--muted);
    }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, #2f3245 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Error state */
    .error-banner {
      display: none;
      padding: 12px 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">

    <div class="error-banner" id="errorBanner"></div>

    <div class="avatar-row">
      <div class="avatar" id="avatarEl">👤</div>
      <div class="profile-info">
        <h1 id="profileName">— — —</h1>
        <div class="subtitle" id="profileSubtitle">TubeCreate Browser Profile</div>
      </div>
    </div>

    <div class="info-section">
      <!-- Status -->
      <div class="info-row">
        <span class="info-label"><span class="icon">🟢</span> Status</span>
        <span class="status-pill active">
          <span class="dot"></span>
          Active
        </span>
      </div>

      <!-- Proxy -->
      <div class="info-row">
        <span class="info-label"><span class="icon">🌐</span> Proxy</span>
        <span class="info-value proxy-none" id="proxyValue">Direct (No proxy)</span>
      </div>

      <!-- Fingerprint -->
      <div class="info-row">
        <span class="info-label"><span class="icon">🔑</span> Fingerprint</span>
        <span class="info-value" id="fingerprintValue">Loading…</span>
      </div>

      <!-- Tags -->
      <div class="info-row" style="flex-direction: column; align-items: flex-start; gap: 10px;">
        <span class="info-label"><span class="icon">🏷️</span> Tags</span>
        <div class="tags-row" id="tagsRow">
          <span class="skeleton" style="width:80px; height:22px;"></span>
          <span class="skeleton" style="width:60px; height:22px;"></span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="footer">
      <div class="brand">Powered by <span>TubeCreate</span></div>
      <div class="open-time" id="openTime"></div>
    </div>

  </div>
</div>

<script>
  // Get profile name from URL
  const params = new URLSearchParams(location.search);
  const profileName = params.get('profile') || location.pathname.split('/').pop() || 'Unknown';

  // Set profile name in title and card immediately
  document.title = `[${profileName}] New Tab`;
  document.getElementById('profileName').textContent = profileName;

  // Set avatar emoji based on profile name char
  const avatarEmojis = ['👤','🧑','👩','🧑‍💼','👨‍💻','🕵️','🧑‍🎨','🤖'];
  const avatarIdx = profileName.charCodeAt(0) % avatarEmojis.length;
  document.getElementById('avatarEl').textContent = avatarEmojis[avatarIdx];

  // Open time
  document.getElementById('openTime').textContent = new Date().toLocaleTimeString('en-US', {
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });

  // Fetch profile config
  fetch(`/api/profile-config/${encodeURIComponent(profileName)}`)
    .then(r => r.json())
    .then(config => {
      // Proxy
      const proxyEl = document.getElementById('proxyValue');
      if (config.proxy && config.proxy.trim()) {
        // Show host:port only, mask credentials
        let displayProxy = config.proxy;
        try {
          const u = new URL(config.proxy);
          displayProxy = `${u.protocol}//${u.hostname}:${u.port}`;
        } catch (e) {
          displayProxy = config.proxy.replace(/:[^:@]+@/, ':***@');
        }
        proxyEl.textContent = displayProxy;
        proxyEl.className = 'info-value proxy-ok';
      } else {
        proxyEl.textContent = 'Direct (No proxy)';
        proxyEl.className = 'info-value proxy-none';
      }

      // Fingerprint
      const fpEl = document.getElementById('fingerprintValue');
      fpEl.textContent = config.fingerprint_id
        ? `#${config.fingerprint_id}`
        : (config.tags?.includes('Mobile') ? 'Mobile' : 'Desktop');

      // Tags
      const tagsRow = document.getElementById('tagsRow');
      const tags = config.tags || ['Chrome'];
      tagsRow.innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');

      // Notes as subtitle
      if (config.notes) {
        document.getElementById('profileSubtitle').textContent = config.notes;
      }
    })
    .catch(err => {
      const banner = document.getElementById('errorBanner');
      banner.style.display = 'block';
      banner.textContent = `Could not load profile config: ${err.message}`;
      document.getElementById('tagsRow').innerHTML = '';
      document.getElementById('fingerprintValue').textContent = '—';
    });
</script>
</body>
</html>
